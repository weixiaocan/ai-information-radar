<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style A - Vintage Editorial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f1e8;
        --ink: #1d1915;
        --muted: #6a5d51;
        --accent: #b96433;
        --card: rgba(255, 252, 247, 0.82);
        --title-size: clamp(2rem, 6vw, 5rem);
        --body-size: clamp(0.85rem, 1.25vw, 1.05rem);
        --small-size: clamp(0.7rem, 0.9vw, 0.85rem);
        --slide-padding: clamp(1rem, 4vw, 4rem);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow-x: hidden; }
      body {
        font-family: "Work Sans", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 18%, rgba(185, 100, 51, 0.16), transparent 26%),
          radial-gradient(circle at 82% 78%, rgba(201, 167, 109, 0.18), transparent 24%),
          var(--bg);
      }
      .slide {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: var(--slide-padding);
        position: relative;
      }
      .slide::before {
        content: "";
        position: absolute;
        inset: 12px;
        border: 1px solid rgba(29, 25, 21, 0.12);
      }
      .meta {
        display: flex;
        justify-content: space-between;
        font-size: var(--small-size);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .layout {
        flex: 1;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        align-items: end;
        gap: 2rem;
      }
      .left {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding-bottom: 2rem;
      }
      .eyebrow {
        color: var(--accent);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-size: var(--small-size);
      }
      h1 {
        font-family: "Fraunces", serif;
        font-size: var(--title-size);
        line-height: 0.92;
        letter-spacing: -0.05em;
        max-width: 8ch;
      }
      .subtitle {
        max-width: 30rem;
        font-size: var(--body-size);
        line-height: 1.6;
        color: var(--muted);
      }
      .card {
        align-self: center;
        background: var(--card);
        border: 1px solid rgba(29, 25, 21, 0.1);
        backdrop-filter: blur(14px);
        border-radius: 2rem;
        box-shadow: 0 30px 80px rgba(67, 43, 26, 0.12);
        padding: 1.35rem 1.4rem;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .chip {
        border: 1px solid rgba(29, 25, 21, 0.12);
        border-radius: 999px;
        padding: 0.42rem 0.8rem;
        font-size: var(--small-size);
        color: var(--muted);
      }
      .card p { font-size: var(--body-size); line-height: 1.65; }
    </style>
  </head>
  <body>
    <section class="slide">
      <div class="meta">
        <span>AI RADAR / EBOOK TO SLIDES</span>
        <span>STYLE A · VINTAGE EDITORIAL</span>
      </div>
      <div class="layout">
        <div class="left">
          <p class="eyebrow">Podcast to deck</p>
          <h1>AI 硬件浪潮才刚开始</h1>
          <p class="subtitle">
            从 VR 的技术遗产、AR 的社交逻辑，到机器人瓶颈、供应链命门与再工业化判断。
          </p>
        </div>
        <aside class="card">
          <div class="chips">
            <span class="chip">11 Slides</span>
            <span class="chip">Physical AI</span>
            <span class="chip">Caitlin Kalinowski</span>
          </div>
          <p>这期内容适合被处理成结构型演示，而不是摘要长文，因为它讲的是一套硬件世界如何判断机会的方法。</p>
        </aside>
      </div>
    </section>
  </body>
</html>
