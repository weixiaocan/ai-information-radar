name: AI Radar source smoke

on:
  workflow_dispatch:
    inputs:
      task:
        description: No-delivery task to validate
        required: true
        default: ingest
        type: choice
        options:
          - ingest
          - weekly

permissions:
  contents: read

concurrency:
  group: ai-radar-production
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      AI_RADAR_STATE_HOST: ${{ vars.AI_RADAR_STATE_HOST }}
      AI_RADAR_STATE_USER: ${{ vars.AI_RADAR_STATE_USER }}
      AI_RADAR_STATE_ROOT: ${{ vars.AI_RADAR_STATE_ROOT }}
      AI_RADAR_PYTHON: python
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
      SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
      SITE_PUBLISH_ENABLED: "false"
      WEEKLY_EBOOK_EXPORT_DIR: ""
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Materialize credential files
        env:
          GMAIL_CREDENTIALS_JSON_B64: ${{ secrets.GMAIL_CREDENTIALS_JSON_B64 }}
          GMAIL_TOKEN_JSON_B64: ${{ secrets.GMAIL_TOKEN_JSON_B64 }}
          AI_RADAR_STATE_SSH_KEY_B64: ${{ secrets.AI_RADAR_STATE_SSH_KEY_B64 }}
          AI_RADAR_STATE_KNOWN_HOSTS_B64: ${{ secrets.AI_RADAR_STATE_KNOWN_HOSTS_B64 }}
        run: bash scripts/hosted/materialize_secrets.sh
      - name: Restore durable state
        run: bash scripts/hosted/restore_state.sh "smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Run no-delivery source smoke
        if: ${{ inputs.task == 'ingest' }}
        run: bash scripts/run_pipeline.sh ingest --days 1
      - name: Run no-delivery weekly dry run
        if: ${{ inputs.task == 'weekly' }}
        run: bash scripts/run_pipeline.sh weekly
      - name: Write sanitized source summary
        if: ${{ always() && inputs.task == 'ingest' }}
        run: python -m src.hosting.smoke_report --root . --github-summary "${GITHUB_STEP_SUMMARY}"
      - name: Check out site for deploy-key preflight
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: weixiaocan/ai-radar-site
          ssh-key: ${{ secrets.AI_RADAR_SITE_DEPLOY_KEY }}
          persist-credentials: false
          path: _site-preflight
      - name: Verify site deploy-key write access without publishing
        run: git -C _site-preflight push --dry-run origin HEAD:main
