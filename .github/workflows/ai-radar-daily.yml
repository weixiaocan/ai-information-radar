name: AI Radar daily production

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN_PRODUCTION to execute a real delivery
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-radar-production
  cancel-in-progress: false

jobs:
  daily:
    if: >-
      vars.AI_RADAR_PRODUCTION_ENABLED == 'true' &&
      (github.event_name == 'schedule' || inputs.confirm == 'RUN_PRODUCTION')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      AI_RADAR_STATE_HOST: ${{ vars.AI_RADAR_STATE_HOST }}
      AI_RADAR_STATE_USER: ${{ vars.AI_RADAR_STATE_USER }}
      AI_RADAR_STATE_ROOT: ${{ vars.AI_RADAR_STATE_ROOT }}
      AI_RADAR_PYTHON: python
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
      SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      SITE_PUBLISH_ENABLED: "true"
      SITE_REPO_PATH: ai-radar-site
      SITE_GIT_BRANCH: main
      WEEKLY_EBOOK_EXPORT_DIR: ""
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out site repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: weixiaocan/ai-radar-site
          path: ai-radar-site
          ssh-key: ${{ secrets.AI_RADAR_SITE_DEPLOY_KEY }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure site Git identity
        run: |
          git -C ai-radar-site config user.name "ai-radar-bot"
          git -C ai-radar-site config user.email "ai-radar-bot@users.noreply.github.com"
      - name: Materialize credential files
        env:
          GMAIL_CREDENTIALS_JSON_B64: ${{ secrets.GMAIL_CREDENTIALS_JSON_B64 }}
          GMAIL_TOKEN_JSON_B64: ${{ secrets.GMAIL_TOKEN_JSON_B64 }}
          AI_RADAR_STATE_SSH_KEY_B64: ${{ secrets.AI_RADAR_STATE_SSH_KEY_B64 }}
          AI_RADAR_STATE_KNOWN_HOSTS_B64: ${{ secrets.AI_RADAR_STATE_KNOWN_HOSTS_B64 }}
        run: bash scripts/hosted/materialize_secrets.sh
      - name: Restore durable state
        run: bash scripts/hosted/restore_state.sh "daily-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Run daily pipeline with durable delivery receipt
        run: bash scripts/hosted/run_daily.sh "daily-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${GITHUB_SHA}"
